version: '3.8'

services:
  # 1. PostgreSQL Database Service
  postgres:
    image: postgres:15-alpine
    container_name: vaayu_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: Vaayu
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d Vaayu"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Cache Service
  redis:
    image: redis:7-alpine
    container_name: vaayu_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Full-Stack Vaayu API & Frontend Service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vaayu_api
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - USE_PG_MEM=false
      - DATABASE_URL=postgres://postgres:password123@postgres:5432/Vaayu
      - USE_REDIS=true
      - REDIS_URL=redis://redis:6379
      - MAPPLS_ACCESS_TOKEN=96dHZVzsAuuOYFtYmgdJpXcnlaSz9G7qm1CuolbZGDSFVdR66fFKzvns9i1BM64A4SctAMSntOnsHRhzLvinxA==
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER:-+13363965109}
      - TWILIO_WHATSAPP_NUMBER=${TWILIO_WHATSAPP_NUMBER:-whatsapp:+14155238886}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-281442205792-qud09vjpv5jqmosl350s4oolbksha5gs.apps.googleusercontent.com}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-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}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
